# Force Python detection - ignore Node.js package.json
[phases.setup]
nixPkgs = ["python311", "pip"]

[phases.install]
cmds = ["cd backend && pip install --no-cache-dir -r requirements.txt"]

[phases.build]
cmds = ["cd backend && alembic upgrade head || true"]

[start]
cmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
